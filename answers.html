<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>My JS Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      padding: 30px;
    }

    h1, h2 {
      color: #1a7a6e;
    }

    button {
      background-color: #1a7a6e;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #145f55;
    }

    input {
      padding: 8px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 6px;
      width: 250px;
      display: block;
      margin-bottom: 4px;
    }

    .output {
      margin-top: 20px;
      padding: 15px;
      background-color: white;
      border-left: 5px solid #1a7a6e;
      border-radius: 6px;
      font-size: 16px;
      color: #333;
      min-height: 50px;
    }

    .error {
      color: red;
      font-size: 14px;
      display: none;
      margin-bottom: 8px;
    }

    .field {
      margin-bottom: 12px;
    }

    hr {
      margin: 40px 0;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

  <!-- =============================================
       SECTION 1: TEAM FORM
  ============================================= -->

  <h1>HACKATHON 2026</h1>
  <h2>Team Form</h2>

  <!-- Input 1: Team Name -->
  <div class="field">
    <input type="text" id="teamName" placeholder="Team name" />
    <p class="error" id="teamNameError">Please enter your team name.</p>
  </div>

  <!-- TODO 1 answer: Number of members input -->
  <div class="field">
    <input type="number" id="teamMembers" placeholder="Number of members" />
    <p class="error" id="teamMembersError">Please enter the number of members.</p>
  </div>

  <!-- TODO 2 answer: Favorite course input -->
  <div class="field">
    <input type="text" id="favCourse" placeholder="Favorite course" />
    <p class="error" id="favCourseError">Please enter your favorite course.</p>
  </div>

  <button onclick="submitForm()">Submit</button>

  <div class="output" id="formOutput">Your team info will appear here...</div>


  <!-- =============================================
       SECTION 2: CALCULATOR
  ============================================= -->

  <hr />

  <h2>Calculator</h2>

  <!-- Input 1: First number -->
  <div class="field">
    <input type="number" id="num1" placeholder="First number" />
    <p class="error" id="num1Error">Please enter the first number.</p>
  </div>

  <!-- TODO 3 answer: Second number input -->
  <div class="field">
    <input type="number" id="num2" placeholder="Second number" />
    <p class="error" id="num2Error">Please enter the second number.</p>
  </div>

  <button onclick="calculate('+')">+</button>

  <!-- TODO 4 answer: Subtract and multiply buttons -->
  <button onclick="calculate('-')">-</button>
  <button onclick="calculate('*')">*</button>

  <div class="output" id="calcOutput">Your result will appear here...</div>


  <!-- =============================================
       JAVASCRIPT
  ============================================= -->
  <script>

    // ── TEAM FORM ─────────────────────────────────

    function submitForm() {

      // TODO 5 answer: Get values from inputs
      let name    = document.getElementById('teamName').value;
      let members = document.getElementById('teamMembers').value;
      let course  = document.getElementById('favCourse').value;

      // Name validation
      if (name === '') {
        document.getElementById('teamNameError').style.display = 'block';
        return;
      } else {
        document.getElementById('teamNameError').style.display = 'none';
      }

      // TODO 6 answer: Validate members
      if (members === '') {
        document.getElementById('teamMembersError').style.display = 'block';
        return;
      } else {
        document.getElementById('teamMembersError').style.display = 'none';
      }

      // TODO 7 answer: Validate course
      if (course === '') {
        document.getElementById('favCourseError').style.display = 'block';
        return;
      } else {
        document.getElementById('favCourseError').style.display = 'none';
      }

      document.getElementById('formOutput').textContent =
        'Hello, we are team ' + name + '. Our team has ' + members +
        ' members, and our favorite course is ' + course + '.';
    }


    // ── CALCULATOR ───────────────────────────────

    // add function
    function add(a, b) {
      let answer = a + b;
      return answer;
    }

    // TODO 8 answer: subtract function
    function subtract(a, b) {
      let answer = a - b;
      return answer;
    }

    // TODO 9 answer: multiply function
    function multiply(a, b) {
      let answer = a * b;
      return answer;
    }

    function calculate(operator) {

      // TODO 10 answer: Get values from inputs
      let val1 = document.getElementById('num1').value;
      let val2 = document.getElementById('num2').value;

      // num1 validation
      if (val1 === '') {
        document.getElementById('num1Error').style.display = 'block';
        return;
      } else {
        document.getElementById('num1Error').style.display = 'none';
      }

      // TODO 11 answer: Validate val2
      if (val2 === '') {
        document.getElementById('num2Error').style.display = 'block';
        return;
      } else {
        document.getElementById('num2Error').style.display = 'none';
      }

      let a = parseFloat(val1);
      let b = parseFloat(val2);
      let result;

      if (operator === '+') {
        // TODO 12 answer: Call add and display result
        result = add(a, b);
        document.getElementById('calcOutput').textContent = a + ' + ' + b + ' = ' + result;

      } else if (operator === '-') {
        // TODO 13 answer: Call subtract and display result
        result = subtract(a, b);
        document.getElementById('calcOutput').textContent = a + ' - ' + b + ' = ' + result;

      } else if (operator === '*') {
        // TODO 14 answer: Call multiply and display result
        result = multiply(a, b);
        document.getElementById('calcOutput').textContent = a + ' * ' + b + ' = ' + result;
      }
    }

  </script>

</body>
</html>
